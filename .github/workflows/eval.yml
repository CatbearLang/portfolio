name: Assistant evaluation

# Retrieval runs on every pull request that touches the backend (no LLM, no secrets).
# The model comparison only runs by hand (Actions > Assistant evaluation > Run workflow) and needs the
# OPENROUTER_API_KEY repository secret. It uses at most `max_calls` requests of the free daily quota.
on:
  pull_request:
    paths: ["backend/**", ".github/workflows/eval.yml"]
  workflow_dispatch:
    inputs:
      models:
        description: '"auto" (the site''s model plus 4 free ones with tool calling) or comma-separated OpenRouter model ids'
        default: auto
      max_calls:
        description: Hard cap on LLM requests for the whole run
        default: "225"

permissions:
  contents: read

jobs:
  retrieval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt
      - run: python -m scripts.eval retrieval
      - run: cat eval/results/retrieval.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-results
          path: backend/eval/results/

  models:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt
      - name: Run the model comparison
        env:
          LLM_BASE_URL: https://openrouter.ai/api/v1
          LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODELS: ${{ inputs.models }}
          MAX_CALLS: ${{ inputs.max_calls }}
        run: |
          test -n "$LLM_API_KEY" || { echo "Add the OPENROUTER_API_KEY repository secret first."; exit 1; }
          python -m scripts.eval models --models "$MODELS" --max-calls "$MAX_CALLS"
      - run: cat eval/results/models.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: model-results
          path: backend/eval/results/
